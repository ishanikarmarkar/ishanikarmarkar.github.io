<!DOCTYPE HTML>
<html lang="en">

<head>
  <title>{{ site.name }}{% if page.title and page.active_tab != 'home' %} · {{ page.title }}{% endif %}</title>

  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta name="author" content="{{ site.name }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <meta name="theme-color" content="#8bbcf1">
  <link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico?v=2" type="image/x-icon">
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico?v=2" type="image/x-icon">
  <link rel="icon" href="{{ site.baseurl }}/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ site.baseurl }}/favicon-96x96.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/apple-touch-icon.png?v=2">

  <!-- MathJax (LaTeX support) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$","$"],["\\(","\\)"]],
        displayMath: [["$$","$$"],["\\[","\\]"]],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: ['script','noscript','style','textarea','pre','code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>

<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="{{ site.baseurl }}/">{{ site.name }}</a>
      <nav class="nav-links">
        <a href="{{ site.baseurl }}/" class="{% if page.active_tab == 'home' %}active{% endif %}">Home</a>
        <a href="{{ site.baseurl }}/publications" class="{% if page.active_tab == 'publications' %}active{% endif %}">Publications</a>
        <a href="{{ site.baseurl }}/experience" class="{% if page.active_tab == 'experience' %}active{% endif %}">Experience</a>
        <a href="{{ site.baseurl }}/fun" class="{% if page.active_tab == 'fun' %}active{% endif %}">Fun</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.name }}</p>
  </footer>
</body>

</html>
